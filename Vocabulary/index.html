<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4efe6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>單字卡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4efe6;
      --ink: #241c16;
      --muted: #8a7f72;
      --line: rgba(70, 46, 22, 0.1);
      --card: #fffdf9;
      --learn: #1f7a4d;
      --learn-soft: #e7f6ee;
      --review: #c2410c;
      --review-soft: #fff1e8;
      --shadow: 0 18px 40px rgba(72, 42, 16, 0.12);
    }

    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      min-height: 100dvh;
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
      background:
        radial-gradient(900px 420px at 50% -12%, #fff8ee 0%, transparent 60%),
        linear-gradient(180deg, #f7f2ea 0%, #efe4d4 100%);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    button, p { font: inherit; }

    .app {
      width: min(100%, 440px);
      min-height: 100dvh;
      margin: 0 auto;
      padding:
        max(18px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(14px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .count {
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.78rem, 3.4vw, 0.95rem);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .bar {
      margin-top: 10px;
      height: 6px;
      border-radius: 999px;
      background: rgba(60, 40, 20, 0.08);
      overflow: hidden;
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--learn);
      transition: width 0.3s ease;
    }

    .stage {
      flex: 1;
      min-height: 0;
      display: grid;
      place-items: center;
    }

    .deck {
      position: relative;
      width: 100%;
      height: min(100%, 580px);
    }

    .shadow {
      position: absolute;
      left: 50%;
      border-radius: 28px;
      background: rgba(255, 253, 249, 0.86);
      border: 1px solid var(--line);
      transform: translateX(-50%);
    }

    .shadow.s1 {
      top: 12px;
      width: calc(100% - 28px);
      height: calc(100% - 24px);
    }

    .shadow.s2 {
      top: 22px;
      width: calc(100% - 56px);
      height: calc(100% - 34px);
      opacity: 0.7;
    }

    .card {
      position: relative;
      z-index: 1;
      height: calc(100% - 28px);
      padding: 28px 24px 24px;
      border: 1px solid rgba(80, 52, 24, 0.08);
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      cursor: grab;
      overflow: hidden;
      transition: transform 0.28s ease, opacity 0.28s ease, background 0.2s ease;
    }

    .card.is-dragging {
      cursor: grabbing;
      transition: none;
    }

    .card-body {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 0;
    }

    .stamp {
      position: absolute;
      top: 26px;
      padding: 4px 12px 6px;
      border: 3px solid;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      opacity: 0;
      pointer-events: none;
    }

    .stamp.learn {
      left: 20px;
      color: var(--learn);
      border-color: var(--learn);
      transform: rotate(-14deg);
    }

    .stamp.review {
      right: 20px;
      color: var(--review);
      border-color: var(--review);
      transform: rotate(14deg);
    }

    .word {
      margin: 0;
      font-family: Fraunces, "Iowan Old Style", Palatino, "Songti TC", serif;
      font-size: clamp(2.5rem, 12vw, 3.8rem);
      font-weight: 560;
      letter-spacing: -0.03em;
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .phonetic-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }

    .phonetic-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .phonetic {
      margin: 0;
      color: #6f655b;
      font-family: "Noto Sans", "Noto Sans TC", sans-serif;
      font-size: 1.15rem;
      letter-spacing: 0.01em;
    }

    .speak {
      flex: none;
      height: 36px;
      padding: 0 10px 0 8px;
      border: 1px solid rgba(80, 52, 24, 0.12);
      border-radius: 999px;
      background: #fff8ef;
      color: #6f655b;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      touch-action: manipulation;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .speak svg {
      width: 15px;
      height: 15px;
      display: block;
    }

    .speak:hover,
    .speak:focus-visible {
      color: var(--ink);
      background: #fff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(31, 122, 77, 0.16);
    }

    .speak.is-speaking {
      color: var(--learn);
      background: var(--learn-soft);
      border-color: transparent;
    }

    .badge {
      align-self: flex-start;
      margin: 14px 0 0;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--review-soft);
      color: var(--review);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .tap-hint {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .card.is-open .tap-hint { display: none; }

    .extra {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows 0.32s ease, opacity 0.32s ease;
    }

    .card.is-open .extra {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 22px;
    }

    .extra-inner {
      min-height: 0;
      overflow: hidden;
    }

    .meaning {
      margin: 0;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      font-size: 1.28rem;
      font-weight: 700;
      line-height: 1.55;
    }

    .example {
      margin: 14px 0 0;
      padding-left: 12px;
      border-left: 3px solid #ead9bf;
      color: #3d342c;
      font-size: 1.02rem;
      line-height: 1.6;
    }

    .example-zh {
      margin: 6px 0 0;
      padding-left: 15px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .deck.is-coaching .tap-hint { visibility: hidden; }

    .card.is-dragging { animation: none; }

    .coach {
      position: absolute;
      z-index: 5;
      left: 0;
      right: 0;
      top: 0;
      height: calc(100% - 28px);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 18px 16px 16px;
      pointer-events: none;
    }

    .coach-mark {
      position: absolute;
      z-index: 2;
      right: 10px;
      bottom: 12px;
      width: min(42%, 168px);
      height: auto;
      opacity: 0;
      transform: scale(0.92);
      transform-origin: right bottom;
      pointer-events: none;
      filter: drop-shadow(0 16px 22px rgba(72, 42, 16, 0.16));
    }

    .coach-head,
    .coach-text,
    .coach-dots {
      max-width: 58%;
    }

    .coach-head {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .coach-nudge {
      flex: none;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff;
      box-shadow: 0 8px 18px rgba(72, 42, 16, 0.1);
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1;
    }

    .coach-nudge.review {
      color: var(--review);
      animation: nudge-left 1.05s ease-in-out infinite;
    }

    .coach-nudge.learn {
      color: var(--learn);
      animation: nudge-right 1.05s ease-in-out infinite;
    }

    .coach-nudge.tap {
      color: var(--ink);
      animation: nudge-tap 1.05s ease-in-out infinite;
    }

    .coach-panel {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 14px 16px 13px;
      border-radius: 20px;
      background: rgba(255, 253, 249, 0.96);
      border: 1.5px solid var(--line);
      box-shadow: 0 12px 28px rgba(72, 42, 16, 0.14);
    }

    .coach-panel.review { border-color: rgba(194, 65, 12, 0.38); }
    .coach-panel.learn { border-color: rgba(31, 122, 77, 0.38); }

    .coach.is-wrong .coach-panel { animation: coach-shake 0.36s ease; }

    .coach-kicker {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .coach-title {
      margin: 3px 0 0;
      font-size: 1.28rem;
      font-weight: 700;
    }

    .coach-panel.review .coach-title { color: var(--review); }
    .coach-panel.learn .coach-title { color: var(--learn); }

    .coach-text {
      margin: 4px 0 0;
      color: #5c534b;
      font-size: 0.98rem;
      line-height: 1.55;
    }

    .coach-dots {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .coach-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(70, 46, 22, 0.16);
    }

    .coach-dots span.is-current { background: var(--ink); }

    .again {
      border: 0;
      background: var(--learn);
      color: white;
    }

    .again:focus-visible {
      outline: 3px solid #e7b089;
      outline-offset: 2px;
    }

    @keyframes nudge-left {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(-12px); }
    }

    @keyframes nudge-right {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(12px); }
    }

    @keyframes nudge-tap {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(0.9); }
    }

    @keyframes coach-shake {
      20% { transform: translateX(-7px); }
      40% { transform: translateX(7px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .func-bar {
      flex: none;
      min-height: 64px;
      border-radius: 22px;
      background: rgba(255, 253, 249, 0.9);
      border: 1px solid var(--line);
    }

    .done {
      width: 100%;
      padding: 36px 24px;
      border-radius: 28px;
      background: var(--card);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .done h2 {
      margin: 0;
      font-family: Fraunces, Palatino, serif;
      font-size: 2rem;
      font-weight: 560;
    }

    .done p {
      margin: 14px 0 0;
      color: #5c534b;
      line-height: 1.7;
    }

    .again {
      margin-top: 22px;
      min-height: 52px;
      padding: 0 28px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 360px) {
      .top-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 4px;
      }

      .count { text-align: left; }
      .card { padding: 22px 18px 18px; }
      .meaning { font-size: 1.12rem; }
    }

    @media (min-width: 800px) {
      body {
        display: grid;
        place-items: center;
      }

      .app {
        min-height: min(100dvh, 900px);
        height: min(100dvh, 900px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="top-row">
        <h1>單字卡</h1>
        <p class="count" id="count">學會 0/8 · 待複習 0</p>
      </div>
      <div class="bar" aria-hidden="true"><span id="barFill"></span></div>
    </header>

    <section class="stage">
      <div class="deck is-coaching" id="deck" data-coach="review">
        <div class="shadow s2" aria-hidden="true"></div>
        <div class="shadow s1" aria-hidden="true"></div>
        <article class="card" id="card" tabindex="0">
          <div class="stamp learn" id="stampLearn" aria-hidden="true">學會</div>
          <div class="stamp review" id="stampReview" aria-hidden="true">不熟悉</div>
          <div class="card-body">
            <p class="word" id="word" lang="en" aria-live="polite"></p>
            <div class="phonetic-list">
              <div class="phonetic-row">
                <p class="phonetic" id="phoneticUk" lang="en" dir="ltr"></p>
                <button class="speak" type="button" data-accent="en-GB" aria-label="播放英國腔">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 10v4h3l5 4V6L7 10H4z"></path>
                    <path d="M16.5 8.5a5 5 0 0 1 0 7"></path>
                  </svg>
                  <span>UK</span>
                </button>
              </div>
              <div class="phonetic-row">
                <p class="phonetic" id="phoneticUs" lang="en" dir="ltr"></p>
                <button class="speak" type="button" data-accent="en-US" aria-label="播放美國腔">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 10v4h3l5 4V6L7 10H4z"></path>
                    <path d="M16.5 8.5a5 5 0 0 1 0 7"></path>
                  </svg>
                  <span>US</span>
                </button>
              </div>
            </div>
            <p class="badge" id="badge" hidden>待複習</p>
            <p class="tap-hint" id="tapHint">點一下，看中文與例句</p>
            <div class="extra" id="extra">
              <div class="extra-inner">
                <p class="meaning" id="meaning"></p>
                <p class="example" id="example" lang="en"></p>
                <p class="example-zh" id="exampleZh"></p>
              </div>
            </div>
          </div>
        </article>
        <div class="coach" id="coach" role="status" aria-live="polite">
          <img class="coach-mark" id="markWrong" src="src/Wrong.png" alt="" aria-hidden="true">
          <img class="coach-mark" id="markCorrect" src="src/Correct.png" alt="" aria-hidden="true">
          <div class="coach-panel review" id="coachPanel">
            <div class="coach-head">
              <div class="coach-nudge review" id="coachNudge" aria-hidden="true">←</div>
              <div>
                <p class="coach-kicker" id="coachKicker">先試一次</p>
                <p class="coach-title" id="coachTitle">不熟悉</p>
              </div>
            </div>
            <p class="coach-text" id="coachText">往左滑這張卡片。還不熟的單字會再出現。</p>
            <div class="coach-dots" id="coachDots" aria-hidden="true"><span class="is-current"></span><span></span><span></span></div>
          </div>
        </div>
      </div>

      <section class="done" id="done" hidden>
        <h2>這輪都學會了</h2>
        <p id="doneText"></p>
        <button class="again" id="again" type="button">再練一輪</button>
      </section>
    </section>

    <nav class="func-bar" id="funcBar" aria-label="功能列"></nav>
  </main>

  <script>
    // 之後換成自己的字庫時，改這個陣列即可。
    const WORDS = [
      {
        word: "abundant",
        phoneticUk: "/əˈbʌndənt/",
        phoneticUs: "/əˈbʌndənt/",
        meaning: "豐富的；大量的",
        example: "The valley is abundant in wildflowers.",
        exampleZh: "這座山谷裡野花開得很茂盛。"
      },
      {
        word: "cautious",
        phoneticUk: "/ˈkɔːʃəs/",
        phoneticUs: "/ˈkɑːʃəs/",
        meaning: "小心的；謹慎的",
        example: "Be cautious when you cross the busy street.",
        exampleZh: "過這條車多的馬路時要小心。"
      },
      {
        word: "delicate",
        phoneticUk: "/ˈdelɪkət/",
        phoneticUs: "/ˈdeləkət/",
        meaning: "精緻的；容易損壞的",
        example: "Please handle the delicate glass with care.",
        exampleZh: "請小心拿這個易碎的玻璃。"
      },
      {
        word: "genuine",
        phoneticUk: "/ˈdʒenjuɪn/",
        phoneticUs: "/ˈdʒenjuən/",
        meaning: "真誠的；真正的",
        example: "She gave me a genuine smile.",
        exampleZh: "她給了我一個真誠的微笑。"
      },
      {
        word: "hesitate",
        phoneticUk: "/ˈhezɪteɪt/",
        phoneticUs: "/ˈhezəteɪt/",
        meaning: "猶豫；遲疑",
        example: "Don't hesitate to ask if you need help.",
        exampleZh: "需要幫忙的話，別猶豫，直接問。"
      },
      {
        word: "immense",
        phoneticUk: "/ɪˈmens/",
        phoneticUs: "/ɪˈmens/",
        meaning: "巨大的；非常廣大的",
        example: "The sky felt immense above the open field.",
        exampleZh: "空曠田野上的天空顯得非常遼闊。"
      },
      {
        word: "patient",
        phoneticUk: "/ˈpeɪʃnt/",
        phoneticUs: "/ˈpeɪʃnt/",
        meaning: "有耐心的",
        example: "A good teacher is patient with beginners.",
        exampleZh: "好的老師對初學者很有耐心。"
      },
      {
        word: "vivid",
        phoneticUk: "/ˈvɪvɪd/",
        phoneticUs: "/ˈvɪvɪd/",
        meaning: "生動的；色彩鮮明的",
        example: "I still have a vivid memory of that summer.",
        exampleZh: "那個夏天我到現在還記得很清楚。"
      }
    ];

    const TAP_SLOP = 8;
    const COACH_STEPS = [
      {
        tone: "review",
        direction: -1,
        nudge: "←",
        kicker: "先試一次",
        title: "不熟悉",
        text: "往左滑這張卡片。還不熟的單字會再出現。"
      },
      {
        tone: "learn",
        direction: 1,
        nudge: "→",
        kicker: "下一步",
        title: "熟悉",
        text: "往右滑。已經學會的單字先放一邊。"
      },
      {
        tone: "tap",
        direction: 0,
        nudge: "點",
        kicker: "最後一步",
        title: "看意思",
        text: "點一下卡片，中文和例句會出現。"
      }
    ];
    const card = document.getElementById("card");
    const deck = document.getElementById("deck");
    const coach = document.getElementById("coach");
    const coachNudge = document.getElementById("coachNudge");
    const coachPanel = document.getElementById("coachPanel");
    const coachKicker = document.getElementById("coachKicker");
    const coachTitle = document.getElementById("coachTitle");
    const coachText = document.getElementById("coachText");
    const coachDots = Array.from(document.querySelectorAll("#coachDots span"));
    const markWrong = document.getElementById("markWrong");
    const markCorrect = document.getElementById("markCorrect");
    const done = document.getElementById("done");
    const doneText = document.getElementById("doneText");
    const funcBar = document.getElementById("funcBar");
    const wordEl = document.getElementById("word");
    const phoneticUkEl = document.getElementById("phoneticUk");
    const phoneticUsEl = document.getElementById("phoneticUs");
    const speakButtons = Array.from(document.querySelectorAll(".speak"));
    const meaningEl = document.getElementById("meaning");
    const exampleEl = document.getElementById("example");
    const exampleZhEl = document.getElementById("exampleZh");
    const badge = document.getElementById("badge");
    const extra = document.getElementById("extra");
    const countEl = document.getElementById("count");
    const barFill = document.getElementById("barFill");
    const stampLearn = document.getElementById("stampLearn");
    const stampReview = document.getElementById("stampReview");

    let queue = [];
    let learned = [];
    let reviewMarks = 0;
    let busy = false;
    let coachStep = 0;
    let pointerId = null;
    let startX = 0;
    let startY = 0;
    let dx = 0;
    let dy = 0;
    let dragging = false;
    let speakToken = 0;

    function accentVoice(lang) {
      if (!window.speechSynthesis) return null;
      const voices = window.speechSynthesis.getVoices();
      const prefix = lang.toLowerCase();
      return voices.find((voice) => voice.lang.toLowerCase() === prefix)
        || voices.find((voice) => voice.lang.toLowerCase().startsWith(prefix))
        || null;
    }

    function stopSpeech() {
      speakToken += 1;
      speakButtons.forEach((button) => button.classList.remove("is-speaking"));
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    }

    function speakCurrent(lang) {
      const item = queue[0];
      const button = speakButtons.find((candidate) => candidate.dataset.accent === lang);
      if (!item || !button || !window.speechSynthesis) return;
      const synth = window.speechSynthesis;
      const restart = synth.speaking || synth.pending;
      if (restart) stopSpeech();
      else {
        speakToken += 1;
        speakButtons.forEach((candidate) => candidate.classList.remove("is-speaking"));
      }
      const token = speakToken;
      const utterance = new SpeechSynthesisUtterance(item.word);
      utterance.lang = lang;
      utterance.rate = 0.92;
      const voice = accentVoice(lang);
      if (voice) utterance.voice = voice;
      const finish = () => {
        if (token === speakToken) button.classList.remove("is-speaking");
      };
      utterance.onend = finish;
      utterance.onerror = finish;
      const start = () => {
        if (token !== speakToken) return;
        button.classList.add("is-speaking");
        synth.speak(utterance);
      };
      if (restart) window.setTimeout(start, 50);
      else start();
    }

    function freshQueue() {
      return WORDS.map((item, index) => ({ ...item, id: index, review: false }));
    }

    function resetDeck() {
      queue = freshQueue();
      learned = [];
      reviewMarks = 0;
      busy = false;
      coachStep = -1;
      clearMotion();
      render();
    }

    function paintCoach() {
      const step = COACH_STEPS[coachStep];
      const active = Boolean(step);
      coach.hidden = !active;
      deck.classList.toggle("is-coaching", active);
      if (!active) {
        deck.removeAttribute("data-coach");
        return;
      }
      deck.dataset.coach = step.tone;
      coach.classList.remove("is-wrong");
      coachNudge.textContent = step.nudge;
      coachNudge.className = `coach-nudge ${step.tone}`;
      coachPanel.className = `coach-panel ${step.tone}`;
      coachKicker.textContent = step.kicker;
      coachTitle.textContent = step.title;
      coachText.textContent = step.text;
      coachDots.forEach((dot, index) => {
        dot.classList.toggle("is-current", index === coachStep);
      });
    }

    function advanceCoach() {
      coachStep += 1;
      if (coachStep >= COACH_STEPS.length) coachStep = -1;
      paintCoach();
    }

    function rejectCoach() {
      coach.classList.remove("is-wrong");
      void coach.offsetWidth;
      coach.classList.add("is-wrong");
    }

    function previewSwipe(direction) {
      if (busy) return;
      busy = true;
      const known = direction > 0;
      card.classList.remove("is-dragging");
      setStamps(known ? 180 : -180);
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const finish = () => {
        clearMotion();
        advanceCoach();
        busy = false;
      };
      if (reduce) {
        setTimeout(finish, 700);
        return;
      }
      card.style.transition = "transform .28s ease, background .2s ease";
      requestAnimationFrame(() => {
        card.style.transform = `translateX(${known ? 26 : -26}%) rotate(${known ? 6 : -6}deg)`;
      });
      setTimeout(finish, 760);
    }

    function render() {
      stopSpeech();
      const total = WORDS.length;
      const learnedCount = learned.length;
      const waiting = queue.filter((item) => item.review).length;
      countEl.textContent = `學會 ${learnedCount}/${total} · 待複習 ${waiting}`;
      barFill.style.width = `${(learnedCount / total) * 100}%`;

      if (!queue.length) {
        coachStep = -1;
        coach.hidden = true;
        deck.classList.remove("is-coaching");
        deck.hidden = true;
        funcBar.hidden = true;
        done.hidden = false;
        doneText.textContent = reviewMarks
          ? `學會 ${total} 張。途中有 ${reviewMarks} 次左滑，那些單字後來也都學會了。`
          : `學會 ${total} 張。這輪沒有需要再複習的單字。`;
        return;
      }

      deck.hidden = false;
      done.hidden = true;
      funcBar.hidden = false;
      paintCoach();

      const item = queue[0];
      wordEl.textContent = item.word;
      phoneticUkEl.textContent = item.phoneticUk;
      phoneticUsEl.textContent = item.phoneticUs;
      speakButtons.forEach((button) => {
        const label = button.dataset.accent === "en-GB" ? "英國腔" : "美國腔";
        button.setAttribute("aria-label", `播放 ${item.word} 的${label}`);
      });
      meaningEl.textContent = item.meaning;
      exampleEl.textContent = item.example;
      exampleZhEl.textContent = item.exampleZh;
      badge.hidden = !item.review;
      card.classList.remove("is-open");
      extra.setAttribute("aria-hidden", "true");
      card.setAttribute("aria-label", `${item.word}，點一下顯示中文與例句`);
    }

    function toggleReveal() {
      const open = card.classList.toggle("is-open");
      extra.setAttribute("aria-hidden", open ? "false" : "true");
    }

    function hideCoachMarks() {
      markWrong.style.opacity = "0";
      markCorrect.style.opacity = "0";
      markWrong.style.transform = "scale(0.92)";
      markCorrect.style.transform = "scale(0.92)";
    }

    function setCoachMarks(distance) {
      const step = coachStep >= 0 ? COACH_STEPS[coachStep] : null;
      const width = card.offsetWidth || 300;
      const threshold = Math.min(110, width * 0.26);
      const amount = Math.min(Math.abs(distance) / threshold, 1);
      const showWrong = Boolean(step && step.direction < 0 && distance < 0);
      const showCorrect = Boolean(step && step.direction > 0 && distance > 0);
      markWrong.style.opacity = showWrong ? String(amount) : "0";
      markCorrect.style.opacity = showCorrect ? String(amount) : "0";
      const scale = (0.92 + amount * 0.08).toFixed(3);
      markWrong.style.transform = `scale(${showWrong ? scale : "0.92"})`;
      markCorrect.style.transform = `scale(${showCorrect ? scale : "0.92"})`;
    }

    function setStamps(distance) {
      const width = card.offsetWidth || 300;
      const threshold = Math.min(110, width * 0.26);
      const amount = Math.min(Math.abs(distance) / threshold, 1);
      const coaching = coachStep >= 0;
      stampLearn.style.opacity = !coaching && distance > 0 ? String(amount) : "0";
      stampReview.style.opacity = !coaching && distance < 0 ? String(amount) : "0";
      if (coaching) setCoachMarks(distance);
      else hideCoachMarks();
      if (distance > 12) card.style.background = "#f3fbf6";
      else if (distance < -12) card.style.background = "#fff7f3";
      else card.style.background = "";
    }

    function clearMotion() {
      card.classList.remove("is-dragging");
      card.style.transition = "";
      card.style.transform = "";
      card.style.opacity = "";
      card.style.background = "";
      stampLearn.style.opacity = "0";
      stampReview.style.opacity = "0";
      hideCoachMarks();
    }

    function settle(known) {
      const current = queue.shift();
      if (known) {
        learned.push(current);
      } else {
        current.review = true;
        reviewMarks += 1;
        queue.push(current);
      }
      clearMotion();
      card.style.transition = "none";
      card.style.opacity = "0";
      card.style.transform = "translateY(12px) scale(0.98)";
      render();
      requestAnimationFrame(() => {
        card.style.transition = "";
        card.style.opacity = "";
        card.style.transform = "";
        busy = false;
      });
    }

    function fly(direction) {
      if (coachStep >= 0 || busy || !queue.length) return;
      stopSpeech();
      busy = true;
      const known = direction > 0;
      card.classList.remove("is-dragging");
      setStamps(known ? 200 : -200);
      card.style.transition = "transform .32s ease, opacity .32s ease";
      const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let finished = false;
      const finish = (event) => {
        if (event && event.propertyName && event.propertyName !== "transform") return;
        if (finished) return;
        finished = true;
        card.removeEventListener("transitionend", finish);
        settle(known);
      };
      if (reduce) {
        finish();
        return;
      }
      requestAnimationFrame(() => {
        card.style.transform = `translateX(${known ? 125 : -125}%) rotate(${known ? 16 : -16}deg)`;
        card.style.opacity = "0.15";
      });
      card.addEventListener("transitionend", finish);
      setTimeout(finish, 420);
    }

    function snapBack() {
      card.classList.remove("is-dragging");
      card.style.transition = "transform .28s ease, background .2s ease";
      card.style.transform = "";
      card.style.background = "";
      stampLearn.style.opacity = "0";
      stampReview.style.opacity = "0";
      hideCoachMarks();
    }

    card.addEventListener("pointerdown", (event) => {
      if (busy || !queue.length || event.button !== 0) return;
      if (event.target.closest(".speak")) return;
      pointerId = event.pointerId;
      startX = event.clientX;
      startY = event.clientY;
      dx = 0;
      dy = 0;
      dragging = false;
      card.setPointerCapture(event.pointerId);
      card.classList.add("is-dragging");
      card.style.transition = "none";
    });

    card.addEventListener("pointermove", (event) => {
      if (event.pointerId !== pointerId) return;
      dx = event.clientX - startX;
      dy = event.clientY - startY;
      if (!dragging && Math.hypot(dx, dy) > TAP_SLOP) dragging = true;
      if (!dragging) return;
      card.style.transform = `translateX(${dx}px) rotate(${dx / 22}deg)`;
      setStamps(dx);
    });

    function endPointer(event) {
      if (event.pointerId !== pointerId) return;
      pointerId = null;
      const width = card.offsetWidth || 300;
      const threshold = Math.min(110, width * 0.26);
      const horizontal = Math.abs(dx) > threshold && Math.abs(dx) > Math.abs(dy);
      if (coachStep >= 0) {
        const step = COACH_STEPS[coachStep];
        if (step.direction === 0) {
          if (dragging) snapBack();
          else {
            card.classList.remove("is-dragging");
            toggleReveal();
            advanceCoach();
          }
        } else if (dragging && horizontal && Math.sign(dx) === step.direction) {
          previewSwipe(step.direction);
        } else if (dragging) {
          snapBack();
          rejectCoach();
        } else {
          card.classList.remove("is-dragging");
        }
      } else if (dragging && horizontal) {
        fly(dx > 0 ? 1 : -1);
      } else if (dragging) {
        snapBack();
      } else {
        card.classList.remove("is-dragging");
        toggleReveal();
      }
      dragging = false;
      dx = 0;
      dy = 0;
    }

    card.addEventListener("pointerup", endPointer);
    card.addEventListener("pointercancel", endPointer);

    speakButtons.forEach((button) => {
      button.addEventListener("pointerdown", (event) => {
        event.stopPropagation();
      });
      button.addEventListener("click", (event) => {
        event.stopPropagation();
        speakCurrent(button.dataset.accent);
      });
      if (!window.speechSynthesis) button.hidden = true;
    });

    document.getElementById("again").addEventListener("click", resetDeck);

    window.addEventListener("keydown", (event) => {
      const coaching = coachStep >= 0 ? COACH_STEPS[coachStep] : null;
      if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
        event.preventDefault();
        const direction = event.key === "ArrowRight" ? 1 : -1;
        if (!coaching) {
          fly(direction);
          return;
        }
        if (coaching.direction === direction) previewSwipe(direction);
        else if (coaching.direction !== 0) rejectCoach();
        return;
      }
      if ((event.key === "Enter" || event.key === " ") && !event.target.closest?.("button")) {
        event.preventDefault();
        if (busy || !queue.length) return;
        if (coaching && coaching.direction === 0) {
          toggleReveal();
          advanceCoach();
        } else if (!coaching) {
          toggleReveal();
        }
      }
    });

    queue = freshQueue();
    render();
  </script>
</body>
</html>
